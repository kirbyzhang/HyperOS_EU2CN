plugins {
    id 'com.android.application' version '8.10.1'
}

android {
    namespace 'local.pudding.weathercompat'
    compileSdk 35

    defaultConfig {
        applicationId 'local.pudding.weathercompat'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
